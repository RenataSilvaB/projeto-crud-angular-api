<h1>Minhas tarefas</h1>

<input
  type="text"
  [(ngModel)]="novaTarefa"
  placeholder="Digite uma tarefa"
>

<button (click)="adicionarTarefa()">Adicionar tarefa</button>

<ul>
  <li *ngFor="let tarefa of tarefas">
    {{ tarefa.id }} - {{ tarefa.titulo }}
    <button (click)="editarTarefa(tarefa.id)">
      Editar
    </button>

    <button (click)="excluirTarefa(tarefa.id)">
  Excluir
</button>
  </li>
</ul>
